<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>503 · Mantenimiento</title>
  <!-- Google Font: Anta -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anta&display=swap" rel="stylesheet">
  <style>
    /* Reset básico y ocupar toda la pantalla */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Anta', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0b0e14; /* fallback oscuro */
      position: relative;
      overflow: hidden;
    }

    /* Video de fondo: cubre toda la pantalla SIN ZOOM y SIN BLUR */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      z-index: 0;
      pointer-events: none;
      background-color: #1a1f2a;
    }

    /* Contenedor principal (sobre el video) */
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100vh;
      padding: 2rem;
      text-align: center;
      color: white;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
    }

    /* Logo en esquina superior izquierda - MÁS PEQUEÑO */
    .logo-top-left {
      position: fixed;
      top: 1.8rem;
      left: 1.8rem;
      z-index: 20;
      max-width: 70px;
      height: auto;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
      transition: transform 0.2s ease;
    }
    .logo-top-left:hover {
      transform: scale(1.02);
    }

    /* Contenedor de iconos en esquina superior derecha */
    .top-right-icons {
      position: fixed;
      top: 1.8rem;
      right: 1.8rem;
      z-index: 20;
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    /* Estilo común para los iconos de la derecha */
    .top-right-icons a {
      color: white;
      transition: transform 0.2s ease, opacity 0.2s ease;
      opacity: 0.8;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .top-right-icons a:hover {
      transform: scale(1.1);
      opacity: 1;
    }
    .top-right-icons a svg {
      width: 32px;
      height: 32px;
      fill: white;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.5));
    }

    /* Texto grande "503" con font Anta */
    .main-number {
      font-family: 'Anta', sans-serif;
      font-size: 15rem;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.02em;
      color: #ffffff;
      text-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
      margin-bottom: 0.25rem;
    }

    /* Texto secundario "Servidores En Mantenimiento, Vuelva pronto" */
    .sub-message {
      font-family: 'Anta', sans-serif;
      font-size: 2.8rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: #f0f4ff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      max-width: 90%;
      margin-top: 0.5rem;
      border-top: 2px solid rgba(255, 255, 255, 0.2);
      padding-top: 0.8rem;
      display: inline-block;
    }

    /* FOOTER: sin barra de fondo, con fuente normal (no Anta) */
    .footer {
      position: fixed;
      bottom: 1.8rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.06em;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
      padding: 0.5rem 1rem;
      white-space: nowrap;
    }

    /* Ajustes responsive */
    @media (max-width: 768px) {
      .main-number {
        font-size: 9rem;
      }
      .sub-message {
        font-size: 2rem;
      }
      .logo-top-left {
        max-width: 55px;
        top: 1.2rem;
        left: 1.2rem;
      }
      .top-right-icons {
        top: 1.2rem;
        right: 1.2rem;
        gap: 0.8rem;
      }
      .top-right-icons a svg {
        width: 28px;
        height: 28px;
      }
      .footer {
        font-size: 0.75rem;
        bottom: 1rem;
        padding: 0.4rem 0.8rem;
      }
    }

    @media (max-width: 480px) {
      .main-number {
        font-size: 6rem;
      }
      .sub-message {
        font-size: 1.6rem;
        padding-top: 0.5rem;
      }
      .logo-top-left {
        max-width: 45px;
        top: 1rem;
        left: 1rem;
      }
      .top-right-icons {
        top: 1rem;
        right: 1rem;
        gap: 0.6rem;
      }
      .top-right-icons a svg {
        width: 24px;
        height: 24px;
      }
      .footer {
        font-size: 0.65rem;
        bottom: 0.8rem;
        padding: 0.3rem 0.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Video de fondo: SIN ZOOM y SIN BLUR -->
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="fondo.mp4" type="video/mp4">
    <!-- fallback: mensaje si no carga el video -->
    Tu navegador no soporta el video de fondo.
  </video>

  <!-- Logo en esquina superior izquierda (logo.png en misma carpeta) - MÁS PEQUEÑO -->
  <img src="logo.png" alt="Logo" class="logo-top-left">

  <!-- Contenedor de iconos en esquina superior derecha (GitHub + Discord) -->
  <div class="top-right-icons">
    <!-- Icono de GitHub -->
    <a href="#" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
      <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">

      </svg>
    </a>
    <!-- Icono de Discord -->
    <a href="#" target="_blank" rel="noopener noreferrer" aria-label="Discord">
      <svg viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83,97.68,97.68,0,0,0-29.11,0A72.37,72.37,0,0,0,45.67,0,105.89,105.89,0,0,0,19.44,8.09C2.79,32.65-1.71,56.6.54,80.21a105.73,105.73,0,0,0,32.17,16.15,77.7,77.7,0,0,0,6.89-11.11,68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2.05a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2.05a68.68,68.68,0,0,1-10.85,5.18,77.44,77.44,0,0,0,6.89,11.11,105.25,105.25,0,0,0,32.19-16.15C128.75,58.68,119.36,34.19,107.7,8.07ZM42.45,65.69c-6.28,0-11.45-5.76-11.45-12.82s5.06-12.82,11.45-12.82,11.56,5.76,11.45,12.82C53.89,59.93,48.84,65.69,42.45,65.69Zm42.24,0c-6.28,0-11.45-5.76-11.45-12.82s5.06-12.82,11.45-12.82,11.56,5.76,11.45,12.82C96.13,59.93,91.08,65.69,84.69,65.69Z"/>
      </svg>
    </a>
  </div>

  <!-- Contenido centrado -->
  <div class="content">
    <div class="main-number">503</div>
    <div class="sub-message">
      Servidores En Mantenimiento,<br>Vuelva pronto
    </div>
  </div>

  <!-- FOOTER con fuente normal (sin Anta) y sin barra de fondo -->
  <footer class="footer">
    © Aqirax AI 2024-2026 Todos Los Derechos Reservados
  </footer>

  <!-- Pequeño script para asegurar que el video se reproduce y no hace zoom -->
  <script>
    (function() {
      const video = document.getElementById('bg-video');
      if (video) {
        video.play().catch(() => {
          console.log('Autoplay bloqueado, pero el video se inicia con interacción');
        });
        // Aseguramos que object-fit se mantenga
        video.style.objectFit = 'cover';
        video.style.objectPosition = 'center center';
        // Eliminamos cualquier posible blur heredado (por si acaso)
        video.style.filter = 'none';
        video.style.backdropFilter = 'none';
      }
    })();
  </script>

</body>
</html>
